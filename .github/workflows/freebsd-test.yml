name: FreeBSD Tests
on:
  push:
    branches: [ "freebsd-tests" ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [ "freebsd-tests" ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  test-freebsd:
    if: github.repository == 'portsbuild/elasticsearch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: false # Disabling CI for now
      RUNTIME_JAVA_HOME: /usr/local/openjdk25
      JAVA_TOOLCHAIN_HOME: /usr/local/openjdk25
      LOCAL_VEC_BINARY_OS: freebsd
      LOCAL_PQRS_BINARY: true
      NATIVE_BUILD: local
      COMMON_BUILD_PARAMS: '-D"build.snapshot=false" -D"license.key=public.key" -D"run.license_type=trial" -D"org.elasticsearch.nativeaccess.enableVectorLibrary=true"'
      COMMON_TEST_PARAMS: '-D"tests.haltonfailure=false" -D"tests.es.node.processors=4" -D"tests.bwc.git_fetch_latest=false" -Dtests.jvm.argline="--add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED"'
    steps:
      - uses: actions/checkout@v7

      - name: Start VM
        id: test-es-freebsd
        uses: portsbuild-vm/freebsd-vm@main
        with:
          release: "14.4"
          # arch: aarch64
          mem: 11264
          cpu: 4
          envs: 'CI RUNTIME_JAVA_HOME JAVA_TOOLCHAIN_HOME LOCAL_VEC_BINARY_OS LOCAL_PQRS_BINARY NATIVE_BUILD COMMON_BUILD_PARAMS COMMON_TEST_PARAMS'
          copyback: false
          cache-after-prepare: false
          prepare: |
            freebsd-version
            pwd
            sysctl hw.model
            sysctl hw.ncpu
            sysctl hw.physmem
            sysctl hw.usermem

      - name: Install dependencies
        shell: freebsd {0}
        run: |
          mkdir -p /usr/local/etc/pkg/repos
          printf 'FreeBSD: {\n  url: "pkg+http://pkg.FreeBSD.org/${ABI}/latest"\n}\n' > /usr/local/etc/pkg/repos/FreeBSD.conf
          pkg update -f -q
          pkg install -y bash curl openjdk17 openjdk21 openjdk25 gmake protobuf rust

      - name: Mount proc
        shell: freebsd {0}
        run: |
          mount -t procfs proc /proc
          java -version

      - name: Add dedicated action user
        shell: freebsd {0}
        run: |
          pw user add -n action -m
          su action -c 'mkdir ~/.gradle'
          su action -c 'printf "org.gradle.java.installations.paths=/usr/local/openjdk17,/usr/local/openjdk21,/usr/local/openjdk25\n" > ~/.gradle/gradle.properties'
          su action -c 'printf "export RUNTIME_JAVA_HOME=/usr/local/openjdk25\nexport JAVA_TOOLCHAIN_HOME=/usr/local/openjdk25\nexport LOCAL_VEC_BINARY_OS=freebsd\nLOCAL_PQRS_BINARY=true\nexport NATIVE_BUILD=local\nexport CI=false\n" >> ~/.profile'
          cd $GITHUB_WORKSPACE
          chown -R action:wheel .

      - name: Build and test
        shell: freebsd {0}
        run: |
          cd $GITHUB_WORKSPACE
          su action -c 'rm -rf libs/entitlement/src/main26'
          su action -c 'rm -rf libs/entitlement/src/main27'
          su action -c 'rm -rf libs/entitlement/qa/entitlement-test-plugin/src/main26'
          su action -c 'ls -alh libs/entitlement/src'
          ls -alh libs/entitlement/src
          su action -c './gradlew copyLibzstd'
          ls -alh libs/native/libraries/build/platform/freebsd-x64/
          su action -c './gradlew classes "${COMMON_BUILD_PARAMS}"'
          echo "=== Building vector library"
          su action -c 'cd libs/simdvec/native/ ; gmake local install'
          ls -alh libs/native/libraries/build/platform/freebsd-x64/
          echo "=== Running ProcessLimits tests"
          su action -c './gradlew ":libs:native:test" --tests "org.elasticsearch.nativeaccess.ProcessLimitsTests.*" "${COMMON_BUILD_PARAMS} ${COMMON_TEST_PARAMS}"'
          ls -alh build/libs/vec/freebsd/amd64/
          echo "=== Running Preallocate tests"
          su action -c './gradlew ":libs:native:test" --tests "org.elasticsearch.nativeaccess.PreallocateTests.*" "${COMMON_BUILD_PARAMS} ${COMMON_TEST_PARAMS}"'
          echo "=== Running remaining native access tests"
          su action -c './gradlew ":libs:native:test" --tests "org.elasticsearch.nativeaccess.*" "${COMMON_BUILD_PARAMS} ${COMMON_TEST_PARAMS}"'
          echo "=== Running all tests"
          su action -c './gradlew test "${COMMON_BUILD_PARAMS} ${COMMON_TEST_PARAMS}"'
